name: Release Codex plugin

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, such as v1.0.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify package before release
        run: |
          python scripts/verify_codex_port.py
          python -m unittest discover -s tests/codex -p "test_*.py" -v
      - name: Build source archives
        run: |
          git archive --format=zip --prefix=codex-brain-starter/ --output=codex-brain-starter.zip HEAD
          git archive --format=tar.gz --prefix=codex-brain-starter/ --output=codex-brain-starter.tar.gz HEAD
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then TAG="${INPUT_TAG}"; fi
          gh release view "${TAG}" >/dev/null 2>&1 || gh release create "${TAG}" --verify-tag --generate-notes
          gh release upload "${TAG}" codex-brain-starter.zip codex-brain-starter.tar.gz --clobber

